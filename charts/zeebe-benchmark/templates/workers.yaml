{{- range $workerName, $worker := .Values.workers }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $workerName }}
  labels:
    app: {{ $workerName }}
spec:
  selector:
    matchLabels:
      app: {{ $workerName }}
  replicas: {{ $worker.replicas | default 3}}
  template:
    metadata:
      labels:
        app: {{ $workerName }}
        app.kubernetes.io/component: zeebe-client
    spec:
      containers:
        - name: {{ $workerName }}
          image: "{{ $.Values.global.image.repository }}/worker:{{ $.Values.global.image.tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          env:
            - name: JDK_JAVA_OPTIONS
              value: >-
                -Dconfig.override_with_env_vars=true
                {{- if $.Values.saas.enabled }}
                -Dapp.tls=true
                {{- else }}
                -Dapp.brokerUrl=http://{{ $.Values.global.connect.serviceName }}:26500
                -Dapp.brokerRestUrl=http://{{ $.Values.global.connect.serviceName }}:8080
                {{- end }}
                -Dapp.preferRest={{ $.Values.global.preferRest.enabled }}
                -Dzeebe.client.requestTimeout=62000
                {{- if $worker.capacity }}
                -Dapp.worker.capacity={{ $worker.capacity }}
                {{- end }}
                {{- if $worker.threads }}
                -Dapp.worker.threads={{ $worker.threads }}
                {{- end }}
                -Dapp.worker.pollingDelay=1ms
                {{- if $worker.completionDelay }}
                -Dapp.worker.completionDelay={{ $worker.completionDelay }}
                {{- else }}
                -Dapp.worker.completionDelay=50ms
                {{- end }}
                -Dapp.worker.workerName={{ $workerName | quote }}
                {{- if $worker.jobType }}
                -Dapp.worker.jobType={{ $worker.jobType | quote }}
                {{- end }}
                {{- if $worker.payloadPath }}
                -Dapp.worker.payloadPath={{ $worker.payloadPath | quote }}
                {{- end}}
                {{- if $worker.message }}
                -Dapp.worker.sendMessage=true
                -Dapp.worker.messageName={{ $worker.message.name | quote }}
                -Dapp.worker.correlationKeyVariableName={{ $worker.message.correlationVariable | quote }}
                {{- end }}
                -XX:+HeapDumpOnOutOfMemoryError
            {{- if $worker.logLevel }}
            - name: LOG_LEVEL
              value: {{ $worker.logLevel | quote }}
            {{- end }}
            {{- if $.Values.saas.enabled }}
            - name: ZEEBE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: {{ include "zeebe-benchmark.credentials-name" $ }}
                  key: zeebeAddress
            - name: ZEEBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "zeebe-benchmark.credentials-name" $ }}
                  key: clientId
            - name: ZEEBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zeebe-benchmark.credentials-name" $ }}
                  key: clientSecret
            - name: ZEEBE_AUTHORIZATION_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "zeebe-benchmark.credentials-name" $ }}
                  key: authServer
            {{- end }}
            - name: ZEEBE_CLIENT_ID
              value: zeebe
            - name: ZEEBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: zeebe-secret
                  name: ck-update-test-zeebe-identity-secret
            - name: ZEEBE_AUTHORIZATION_SERVER_URL
              value: http://ck-update-test-keycloak:80/auth/realms/camunda-platform/protocol/openid-connect/token
            - name: CAMUNDA_CLIENT_ZEEBE_AUDIENCE
              value: zeebe-api
          {{- if $worker.resources }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 9600
              name: "http"
---
{{- end }}
