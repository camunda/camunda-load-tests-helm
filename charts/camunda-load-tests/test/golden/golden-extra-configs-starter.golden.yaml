---
# Source: camunda-load-tests/templates/starter.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starter
  labels:
    app: starter
spec:
  selector:
    matchLabels:
      app: starter
  replicas: 1
  template:
    metadata:
      labels:
        app: starter
        app.kubernetes.io/component: zeebe-client
    spec:
      containers:
        - name: starter
          image: "gcr.io/zeebe-io/starter:SNAPSHOT"
          imagePullPolicy: Always
          env:
            - name: JDK_JAVA_OPTIONS
              value: >-
                -Dconfig.override_with_env_vars=true
                -Dapp.brokerUrl=http://camunda-gateway:26500
                -Dapp.brokerRestUrl=http://camunda-gateway:8080
                -Dapp.preferRest=false
                -Dapp.starter.rate=150
                -Dapp.starter.durationLimit=0
                -Dzeebe.client.requestTimeout=62000
                -Dapp.starter.processId="benchmark"
                -Dapp.starter.bpmnXmlPath="bpmn/one_task.bpmn"
                -Dapp.starter.businessKey="businessKey"
                -Dapp.starter.payloadPath="bpmn/typical_payload.json"
                -XX:+HeapDumpOnOutOfMemoryError
            - name: LOG_LEVEL
              value: "WARN"
            # To be able to load a separate/additional configuration
            - name: SPRING_CONFIG_ADDITIONALLOCATION
              value: "/usr/local/camunda/config/load-test-config.yaml"
          envFrom:
            - configMapRef:
                name: starter-config
                optional: true
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          ports:
            - containerPort: 9600
              name: "http"
          volumeMounts:
            - name: load-test-config
              mountPath: /usr/local/camunda/config/load-test-config.yaml
              subPath: load-test-config.yaml
      volumes:
        - name: load-test-config
          configMap:
            name: load-test-config
            defaultMode: 0754