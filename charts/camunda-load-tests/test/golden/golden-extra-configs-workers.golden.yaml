---
# Source: camunda-load-tests/templates/workers.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
    app.kubernetes.io/name: camunda-load-tests
    app.kubernetes.io/instance: load-test
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app: worker
  replicas: 3
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/component: zeebe-client
        app.kubernetes.io/name: camunda-load-tests
        app.kubernetes.io/instance: load-test
        app.kubernetes.io/version: "8.8.0"
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/config: 72a78853417d01814f00711ca713a5f41dd7f143130ad54363bc6a69beaa116e
        
    spec:
      containers:
        - name: worker
          image: "gcr.io/zeebe-io/worker:SNAPSHOT"
          imagePullPolicy: Always
          env:
            - name: JDK_JAVA_OPTIONS
              value: >-
                -XX:+HeapDumpOnOutOfMemoryError
            - name: LOG_LEVEL
              value: "INFO"
            # To be able to load a separate/additional configuration
            - name: SPRING_CONFIG_ADDITIONALLOCATION
              value: "/usr/local/camunda/config/load-test-config.yaml"
            ##
            ## Spring Boot compatible env vars (for migrated load tester, ignored by old HOCON app)
            ##
            - name: CAMUNDA_CLIENT_PREFER_REST_OVER_GRPC
              value: "false"
            - name: LOAD_TESTER_PERFORM_READ_BENCHMARKS
              value: "false"
            - name: CAMUNDA_CLIENT_GRPC_ADDRESS
              value: "http://camunda-gateway:26500"
            - name: CAMUNDA_CLIENT_REST_ADDRESS
              value: "http://camunda-gateway:8080"
            - name: LOAD_TESTER_WORKER_CAPACITY
              value: "60"
            - name: LOAD_TESTER_WORKER_THREADS
              value: "10"
            - name: LOAD_TESTER_WORKER_COMPLETION_DELAY
              value: "50ms"
            - name: LOAD_TESTER_WORKER_WORKER_NAME
              value: "worker"
            - name: LOAD_TESTER_WORKER_JOB_TYPE
              value: "benchmark-task"
            - name: LOAD_TESTER_WORKER_PAYLOAD_PATH
              value: "bpmn/typical_payload.json"
            - name: LOGGING_LEVEL_IO_CAMUNDA_ZEEBE
              value: "INFO"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 9600
              name: "http"
          volumeMounts:
            - name: load-test-config
              mountPath: /usr/local/camunda/config/load-test-config.yaml
              subPath: load-test-config.yaml
      volumes:
        - name: load-test-config
          configMap:
            name: load-test-config
            defaultMode: 0754


