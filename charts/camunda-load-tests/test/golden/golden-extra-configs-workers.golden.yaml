---
# Source: camunda-load-tests/templates/workers.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  selector:
    matchLabels:
      app: worker
  replicas: 3
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/component: zeebe-client
    spec:
      containers:
        - name: worker
          image: "gcr.io/zeebe-io/worker:SNAPSHOT"
          imagePullPolicy: Always
          env:
            - name: JDK_JAVA_OPTIONS
              value: >-
                -Dconfig.override_with_env_vars=true
                -Dapp.brokerUrl=http://camunda-gateway:26500
                -Dapp.brokerRestUrl=http://camunda-gateway:8080
                -Dapp.preferRest=false
                -Dzeebe.client.requestTimeout=62000
                -Dapp.worker.capacity=60
                -Dapp.worker.threads=10
                -Dapp.worker.pollingDelay=1ms
                -Dapp.worker.completionDelay=50ms
                -Dapp.worker.workerName="worker"
                -Dapp.worker.jobType="benchmark-task"
                -Dapp.worker.payloadPath="bpmn/typical_payload.json"
                -XX:+HeapDumpOnOutOfMemoryError
            - name: LOG_LEVEL
              value: "WARN"
            # To be able to load a separate/additional configuration
            - name: SPRING_CONFIG_ADDITIONALLOCATION
              value: "/usr/local/camunda/config/load-test-config.yaml"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 9600
              name: "http"
          volumeMounts:
            - name: load-test-config
              mountPath: /usr/local/camunda/config/load-test-config.yaml
              subPath: load-test-config.yaml
      volumes:
        - name: load-test-config
          configMap:
            name: load-test-config
            defaultMode: 0754