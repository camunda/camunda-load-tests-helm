---
# Source: camunda-load-tests/templates/starter.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starter
  labels:
    app: starter
    app.kubernetes.io/name: camunda-load-tests
    app.kubernetes.io/instance: load-test
    app.kubernetes.io/version: "8.8.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app: starter
  replicas: 1
  template:
    metadata:
      labels:
        app: starter
        app.kubernetes.io/component: zeebe-client
        app.kubernetes.io/name: camunda-load-tests
        app.kubernetes.io/instance: load-test
        app.kubernetes.io/version: "8.8.0"
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/config: e8336a4e36fbb6f1f0137aef57a4e26c600cb335157a4fd7bd72064b06dee7a6
        checksum/saas-credentials: 55680a76bdaa71a1066a3faa169123a1f124934633ead82234a6407d9825c513
    spec:
      containers:
        - name: starter
          image: "gcr.io/zeebe-io/starter:SNAPSHOT"
          imagePullPolicy: Always
          env:
            - name: JDK_JAVA_OPTIONS
              value: >-
                -XX:+HeapDumpOnOutOfMemoryError
            - name: LOG_LEVEL
              value: "INFO"
            - name: ZEEBE_REST_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeRestAddress
            - name: ZEEBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientId
            - name: ZEEBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: clientSecret
            - name: ZEEBE_AUTHORIZATION_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authServer
            - name: ZEEBE_TOKEN_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authorizationAudience
            - name: ZEEBE_AUTH_TYPE
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: authType
            - name: ZEEBE_GRPC_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: load-test-credentials
                  key: zeebeGrpcAddress
            # To be able to load a separate/additional configuration
            - name: SPRING_CONFIG_ADDITIONALLOCATION
              value: "/usr/local/camunda/config/load-test-config.yaml"
            ##
            ## Spring Boot compatible env vars (for migrated load tester, ignored by old HOCON app)
            ##
            - name: CAMUNDA_CLIENT_PREFER_REST_OVER_GRPC
              value: "false"
            - name: LOAD_TESTER_PERFORM_READ_BENCHMARKS
              value: "false"
            - name: CAMUNDA_CLIENT_MODE
              value: "saas"
            - name: CAMUNDA_CLIENT_AUTH_METHOD
              value: "oidc"
            - name: LOAD_TESTER_STARTER_RATE
              value: "150"
            - name: LOAD_TESTER_STARTER_PROCESS_ID
              value: "benchmark"
            - name: LOAD_TESTER_STARTER_BPMN_XML_PATH
              value: "bpmn/one_task.bpmn"
            - name: LOAD_TESTER_STARTER_BUSINESS_KEY
              value: "businessKey"
            - name: LOAD_TESTER_STARTER_PAYLOAD_PATH
              value: "bpmn/typical_payload.json"
            - name: LOGGING_LEVEL_IO_CAMUNDA_ZEEBE
              value: "INFO"
          envFrom:
            - configMapRef:
                name: starter-config
                optional: true
          resources:
            limits:
              cpu: 250m
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 2Gi
          ports:
            - containerPort: 9600
              name: "http"
          volumeMounts:
            - name: load-test-config
              mountPath: /usr/local/camunda/config/load-test-config.yaml
              subPath: load-test-config.yaml
      volumes:
        - name: load-test-config
          configMap:
            name: load-test-config
            defaultMode: 0754

