---
# Source: camunda-load-tests/templates/starter.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starter
  labels:
    app: starter
spec:
  selector:
    matchLabels:
      app: starter
  replicas: 1
  template:
    metadata:
      labels:
        app: starter
        app.kubernetes.io/component: zeebe-client
      annotations:
        
    spec:
      containers:
        - name: starter
          image: "gcr.io/zeebe-io/starter:SNAPSHOT"
          imagePullPolicy: Always
          env:
            - name: JDK_JAVA_OPTIONS
              value: >-
                -Dconfig.override_with_env_vars=true
                -Dapp.brokerUrl=http://camunda-gateway:26500
                -Dapp.brokerRestUrl=http://camunda-gateway:8080
                -Dapp.preferRest=false
                -Dapp.performReadBenchmarks=false
                -Dapp.starter.rate=150
                -Dapp.starter.durationLimit=0
                -Dzeebe.client.requestTimeout=62000
                -Dapp.starter.processId="real"
                -Dapp.starter.bpmnXmlPath="bpmn/real.bpmn"
                -Dapp.starter.extraBpmnModels.0="bpmn/extra.bpmn"
                -Dapp.starter.extraBpmnModels.1="bpmn/extra.dmn"
                -Dapp.starter.businessKey="customerId"
                -Dapp.starter.payloadPath="empty.json"
                -XX:+HeapDumpOnOutOfMemoryError
            - name: LOG_LEVEL
              value: "INFO"
            ##
            ## Spring Boot compatible env vars (for migrated load tester, ignored by old HOCON app)
            ##
            - name: CAMUNDA_CLIENT_PREFER_REST_OVER_GRPC
              value: "false"
            - name: LOAD_TESTER_PERFORM_READ_BENCHMARKS
              value: "false"
            - name: CAMUNDA_CLIENT_GRPC_ADDRESS
              value: "http://camunda-gateway:26500"
            - name: CAMUNDA_CLIENT_REST_ADDRESS
              value: "http://camunda-gateway:8080"
            - name: LOAD_TESTER_STARTER_RATE
              value: "150"
            - name: LOAD_TESTER_STARTER_DURATION_LIMIT
              value: "0"
            - name: LOAD_TESTER_STARTER_PROCESS_ID
              value: "real"
            - name: LOAD_TESTER_STARTER_BPMN_XML_PATH
              value: "bpmn/real.bpmn"
            - name: LOAD_TESTER_STARTER_EXTRA_BPMN_MODELS_0_
              value: "bpmn/extra.bpmn"
            - name: LOAD_TESTER_STARTER_EXTRA_BPMN_MODELS_1_
              value: "bpmn/extra.dmn"
            - name: LOAD_TESTER_STARTER_BUSINESS_KEY
              value: "customerId"
            - name: LOAD_TESTER_STARTER_PAYLOAD_PATH
              value: "empty.json"
            - name: LOGGING_LEVEL_IO_CAMUNDA_ZEEBE
              value: "INFO"
          envFrom:
            - configMapRef:
                name: starter-config
                optional: true
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          ports:
            - containerPort: 9600
              name: "http"