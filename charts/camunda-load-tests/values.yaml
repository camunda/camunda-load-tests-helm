# Default values for Camunda load tests Helm chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The values file follows helm best practices https://helm.sh/docs/chart_best_practices/values/
#
# This means:
#   * Variable names should begin with a lowercase letter, and words should be separated with camelcase.
#   * Every defined property in values.yaml should be documented. The documentation string should begin with the name of the property that it describes, and then give at least a one-sentence description
#
# Furthermore, we try to apply the following pattern: # [VarName] [conjunction] [definition]
#
# VarName:
#
#  * In the documentation the variable name is started with a big letter, similar to kubernetes resource documentation.
#  * If the variable is part of a subsection/object we use a json path expression (to make it more clear where the variable belongs to).
#    The root (chart name) is omitted (e.g. zeebe). This is useful for using --set in helm.
#
# Conjunction:
#   * [defines] for mandatory configuration
#   * [can be used] for optional configuration
#   * [if true] for toggles
#   * [configuration] for section/group of variables

# Global configuration for variables which can be accessed by all sub charts
global:
  # PreferRest allows to configure load test applications to make use of the REST API, instead of the gRPC API.
  preferRest:
    enabled: false
  # PerformReadBenchmarks if true enables read benchmarks in the load test applications
  performReadBenchmarks: false
  connect:
    serviceName: camunda-gateway
  # global.extraConfig allows to configure extra configuration for all load test applications
  extraConfig:
    # Example to disable data availability monitoring in load test applications
    # app.monitorDataAvailability: false
  # global.extraEnvVars allows to configure extra environment variables for all load test applications
  extraEnvVars: []
    # For the old HOCON-based load tester, use CONFIG_FORCE_ prefix:
    # https://github.com/lightbend/config?tab=readme-ov-file#optional-system-or-env-variable-overrides
    # - name: CONFIG_FORCE_app_monitorDataAvailability
    #   value: "false"
    #
    # For the new Spring Boot-based load tester, use standard Spring relaxed binding:
    # - name: LOAD_TESTER_MONITOR_DATA_AVAILABILITY
    #   value: "false"
    #
    # Environment variables values can also be fetched from ConfigMaps or Secrets using valueFrom, e.g.:
    # - name: CLOUD_CREDENTIALS
    #   valueFrom:
    #     secretKeyRef:
    #       key: secret
    #       name: credentials
    #
    # Common connection/auth env vars (starter.rate, worker.capacity, etc.)
    # are set automatically by the chart templates for both old and new apps.

  # global.nodeSelector can be used to configure node selectors for all load test pods
  nodeSelector: {}
  # global.tolerations can be used to configure tolerations for all load test pods
  tolerations: []

  image:
    # Image.repository defines the repository from which to fetch the docker images
    repository: "gcr.io/zeebe-io"
    # Image.tag defines the tag / version which should be used in the chart
    tag: SNAPSHOT
    ## @param global.image.pullPolicy defines the image pull policy which should be used https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
    pullPolicy: Always
    ## @param global.image.pullSecrets can be used to configure image pull secrets https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
    pullSecrets: []
  identity:
    auth:
      enabled: false
  # global.commonLabels can be used to add labels to all resources deployed by this chart
  commonLabels: {}

# Saas configuration to run load tests against Camunda SaaS environment
saas:
  # Saas.enabled if true enables the load tests to run against Camunda SaaS
  enabled: false

  # Saas.credentials configuration to connect to a Camunda SaaS cluster
  credentials:
    # Saas.existingSecret can be used to configure the secret name that should be referenced by the load tests
    # applications to retrieve credential information.
    #
    # If this value is set, other credentials are not used.
    #
    # Credentials Secret need to follow the following format:
    #
    # apiVersion: v1
    # kind: Secret
    # metadata:
    #   name: cloud-credentials
    # type: Opaque
    # stringData:
    #   clientId: hH55UFivfw-bbHAuPwN545oyv8tTdW0z
    #   clientSecret: xtHQB.zBLcQrw4GaP0k_ci~ePjbD8qVlYaFKNo__2a7ZJxL-DAVVHepq~X9elPRb
    #   zeebeRestAddress: e314a337-a462-4988-a3be-d1f2e153e034.zeebe.ultrawombat.com:443
    #   authServer: https://login.cloud.ultrawombat.com/oauth/token
    existingSecret:

    # Saas.credentials.clientId to define the clientId to connect
    clientId: ""
    # Saas.credentials.clientSecret to define the clientSecret to connect
    clientSecret: ""
    # Saas.credentials.zeebeRestAddress to define the rest address of the cluster (including port)
    zeebeRestAddress: ""
    # SaaS.credentials.authServer to define the authentication server to retrieve JWT tokens
    authServer: "https://login.cloud.ultrawombat.com/oauth/token"
    # Saas.credentials.authType to define the authentication type for the starter and workers
    authType: "OAUTH"
    # Saas.credentials.zeebeGrpcAddress to define the grpc address of the cluster (including port)
    zeebeGrpcAddress: ""
    # Saas.credentials.authorizationAudience to define the auth audience of the cluster
    authorizationAudience: "zeebe.ultrawombat.com"

# Workers configuration for the to be deployed worker application
#        => New way to deploy workers <=
workers:
  worker:
    # Workers.worker.replicas defines how many replicas of the load test worker should be deployed
    replicas: 3
    # Workers.worker.capacity defines how many jobs the worker should activate and work on
    capacity: 60
    # Workers.worker.threads defines how many threads the worker can use to work on jobs
    threads: 10
    # Workers.worker.jobType defines the job type which should be used by the worker
    jobType: "benchmark-task"
    # Workers.worker.payloadPath defines the path (inside the worker app) to the payload resource
    # that should be used to complete the corresponding jobs
    payloadPath: "bpmn/typical_payload.json"
    # Workers.worker.completionDelay defines the delay of the worker before completing a job
    completionDelay: 50ms
    # Workers.worker.logLevel defines the logging level for the load test worker
    logLevel: "INFO"
    # Workers.worker.resources defines the resources for the load test worker
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 512Mi
    # Workers.worker.probes configures Kubernetes liveness and readiness probes
    # for this worker. The same block shape may be used (or omitted) on any
    # additional worker entry under workers.<name>. When omitted, probes default
    # to enabled with the timings shown here (defaults are baked into the
    # template so custom workers do not need to repeat the block).
    # Rationale for the numbers matches starter.probes above:
    #   initialDelaySeconds liveness=30 (JVM + Spring startup), readiness=10
    #     (earliest job-worker can be ready);
    #   periodSeconds=10 (standard cadence, no liveness/readiness asymmetry);
    #   timeoutSeconds=3 (tolerates GC pauses);
    #   failureThreshold=3 (~30s of sustained failure before action).
    probes:
      enabled: true
      liveness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3

  # Workers.worker defines the configuration for the default load test worker
  # Adding more and different worker can be done via adding a new map like:
  #  worker-2:
  #    # Workers.worker.replicas defines how many replicas of the load test worker should be deployed
  #    replicas: 3
  #    # Workers.worker.capacity defines how many jobs the worker should activate and work on
  #    capacity: 60
  #    # Workers.worker.jobType defines the job type which should be used by the worker
  #    jobType: "benchmark-2-task"
  #    # Workers.worker.logLevel defines the logging level for the load test worker
  #    logLevel: "WARN"
  #    # Workers.worker.resources defines the resources for the load test worker
  #    resources:
  #      limits:
  #        cpu: 500m
  #        memory: 512Mi
  #      requests:
  #        cpu: 500m
  #        memory: 512Mi

# Starter configuration for the to be deployed starter application
starter:
  # Starter.replicas defines how many replicas of the application should be deployed
  replicas: 1
  # Starter.rate defines with which rate process instances should be created by the starter
  rate: 150
  # Starter.rateDuration can be used to define the time unit for the rate (e.g. "1s" for per-second, "1m" for per-minute).
  # If not set, the application default is used.
  rateDuration:
  # Starter.durationLimit can be used to stop creating process instances after the given number of seconds.
  # If not set (or set to 0), the starter runs indefinitely.
  durationLimit:
  # Starter.logLevel defines the logging level for the load test starter
  logLevel: "INFO"
  # Starter.processId defines the process ID, that should be used for creating new process instances
  processId: "benchmark"
  # Starter.payloadPath defines the path (inside the starter app) to the payload resource
  # that should be used to create the corresponding process instance
  payloadPath: "bpmn/typical_payload.json"
  # Starter.bpmnXmlPath defines the path (inside the starter app) to the main bpmn XML resource that should be deployed
  bpmnXmlPath: "bpmn/one_task.bpmn"
  # Starter.extraBpmnModels can be used to specify paths (inside the starter app) to extra resources that should be deployed
  extraResources: []
  # Starter.businessKey can be used to specify a businessKey variable, inside a unique identifier is stored for
  # each created process instance
  businessKey: "businessKey"
  # Starter.resources defines the resource requests and limits for the load test starter
  resources:
    limits:
      cpu: 250m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 2Gi
  # Starter.probes configuration for Kubernetes liveness and readiness probes
  # backed by the Spring Boot Actuator health endpoints exposed by the load-tester
  # app on container port 9600 (/health/liveness and /health/readiness).
  probes:
    # Starter.probes.enabled if true adds liveness and readiness probes to the starter pod
    enabled: true
    # Starter.probes.liveness HTTP probe against /health/liveness.
    # initialDelaySeconds=30: JVM cold-start + Spring context init typically completes
    #   well under 30s; this avoids premature liveness failures.
    # periodSeconds=10: standard Spring Boot probe cadence; aligned with readiness
    #   below to avoid arbitrary asymmetry.
    # timeoutSeconds=3: actuator health responds in <100ms locally; 3s tolerates
    #   transient GC pauses.
    # failureThreshold=3: 3 consecutive failures = ~30s of sustained unresponsiveness
    #   before pod restart.
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    # Starter.probes.readiness HTTP probe against /health/readiness.
    # initialDelaySeconds=10: readiness flips earliest after broker topology
    #   connect + first scheduled tick; checking sooner just wastes calls.
    # Other fields match liveness intentionally.
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
