{{- $oidc := include "camunda-load-tests.oidc" . | fromYaml -}}
{{- $credentials := $oidc.credentials | default dict -}}
{{- if and $oidc.enabled (not $credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "camunda-load-tests.credentials-name" .}}
  labels:
    {{- include "camunda-load-tests.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientId: {{ $credentials.clientId }}
  clientSecret: {{ $credentials.clientSecret }}
  zeebeRestAddress: {{ $credentials.zeebeRestAddress }}
  authServer: {{ $credentials.authServer }}
  authType: {{ $credentials.authType }}
  zeebeGrpcAddress: {{- if $credentials.zeebeGrpcAddress }} {{ $credentials.zeebeGrpcAddress }}{{- end }}
  authorizationAudience: {{ $credentials.authorizationAudience }}
{{- end }}